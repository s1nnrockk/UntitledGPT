<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>BlueChat — AI</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#0d121c;--panel2:#111a27;--line:#202c3c;--text:#e8f0fa;--muted:#8393a8;--blue:#38a8ff;--blue2:#1479d5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:260px 1fr;background:radial-gradient(ellipse at 65% -10%,#10233a 0,transparent 38%),var(--bg)}
.sidebar{border-right:1px solid var(--line);background:#090d14;padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:750;font-size:18px;letter-spacing:-.5px}
.logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(145deg,#49c4ff,#1264ce);display:grid;place-items:center;box-shadow:0 0 25px #1689ff38}
.new{width:100%;border:1px solid #244766;background:#102338;color:#d9efff;border-radius:12px;padding:11px 12px;text-align:left;display:flex;align-items:center;gap:9px;transition:.2s}
.new:hover{background:#16314c;border-color:#368fd0;transform:translateY(-1px)}
.section{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#64758b;padding:4px 9px}
.history{display:flex;flex-direction:column;gap:4px;overflow:auto}
.chatitem{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#9cabbc;padding:10px;border-radius:9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem.active,.chatitem:hover{background:#141e2b;color:#e6f2ff}
.sidebottom{margin-top:auto;color:#607188;font-size:12px;padding:8px}
.main{min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:64px;border-bottom:1px solid #182332;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090e16d9;backdrop-filter:blur(18px)}
.model{display:flex;align-items:center;gap:9px;font-weight:650}.dot{width:7px;height:7px;background:#38dca0;border-radius:50%;box-shadow:0 0 12px #38dca077}
.tag{font-size:11px;font-weight:600;color:#8ecfff;background:#11283b;border:1px solid #1d4565;border-radius:6px;padding:3px 7px}
.topright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.iconbtn{width:34px;height:34px;border:1px solid var(--line);background:#101722;color:#a7b7c9;border-radius:10px}
.messages{flex:1;overflow:auto;padding:32px 22px 24px;scroll-behavior:smooth}
.thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.welcome{min-height:55vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.welcome h1{font-size:clamp(30px,4vw,48px);letter-spacing:-1.7px;margin:0;background:linear-gradient(100deg,#f3f8ff 25%,#58baff 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);margin:0;max-width:480px}
.spark{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#122b43,#0b1725);border:1px solid #244c6d;display:grid;place-items:center;color:#6cc7ff;box-shadow:0 0 45px #158cff18}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,600px);margin-top:16px}
.suggestion{border:1px solid #1c2a3b;background:#0d141e;color:#aabbd0;border-radius:12px;padding:13px 15px;text-align:left;transition:.2s}
.suggestion:hover{border-color:#2b76ad;background:#101e2d;color:#e5f5ff}
.message{display:flex;gap:14px;align-items:flex-start;animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.avatar{flex:0 0 30px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700}
.user .avatar{background:#1b2a3a;color:#b8d5ee}.assistant .avatar{background:linear-gradient(145deg,#197fce,#114d99);color:white}
.content{min-width:0;flex:1;padding-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.content p{margin:0 0 10px}.content p:last-child{margin-bottom:0}
.content pre{white-space:pre-wrap;background:#080d14;border:1px solid #1b2938;padding:14px;border-radius:10px;overflow:auto}
.composerwrap{padding:0 20px 20px;background:linear-gradient(transparent,#080b12 25%)}
.composer{max-width:820px;margin:0 auto;border:1px solid #26384b;background:#0d141e;border-radius:18px;padding:12px 12px 9px;box-shadow:0 12px 50px #0005;transition:border-color .2s}
.composer:focus-within{border-color:#2778b5;box-shadow:0 0 0 3px #167ac018,0 12px 50px #0005}
textarea{display:block;width:100%;resize:none;max-height:180px;min-height:52px;border:0;outline:0;background:transparent;color:var(--text);padding:7px 8px}
textarea::placeholder{color:#61748a}
.composerfoot{display:flex;align-items:center;justify-content:space-between;padding:4px 3px 0 8px;color:#64758a;font-size:11px}
.send{width:36px;height:36px;border:0;border-radius:11px;background:linear-gradient(145deg,#38b5ff,#1672d0);color:white;font-size:18px;font-weight:700;box-shadow:0 4px 15px #168cff30}
.send:disabled{opacity:.35;cursor:default}
.notice{text-align:center;color:#526176;font-size:11px;margin:9px auto 0;max-width:820px}
.status{color:#6c829a;font-size:12px}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 14px}.messages{padding:20px 14px}.composerwrap{padding:0 10px 12px}.suggestions{grid-template-columns:1fr}.welcome{min-height:48vh}.topright .status{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5v14M7 7l10 10M17 7 7 17" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg></div>BlueChat</div>
<button class="new" id="newChat"><span>＋</span> Новый чат</button>
<div class="section">Недавние</div><div class="history" id="history"></div>
<div class="sidebottom">Powered by LLM7.io<br>Free AI · gpt-oss:20b</div>
</aside>
<main class="main">
<header class="topbar"><div class="model"><span class="dot"></span> BlueChat <span class="tag">GPT-OSS 20B</span></div><div class="topright"><span class="status" id="status">Бесплатная модель · онлайн API</span><button class="iconbtn" id="clear" title="Очистить чат">↻</button></div></header>
<div class="messages" id="messages"><div class="thread" id="thread"></div></div>
<div class="composerwrap"><form class="composer" id="form"><textarea id="prompt" rows="1" placeholder="Напиши сообщение..." aria-label="Сообщение"></textarea><div class="composerfoot"><span>Enter — отправить · Shift+Enter — новая строка</span><button class="send" id="send" aria-label="Отправить">↑</button></div></form><div class="notice">Ответы генерируются внешним сервисом LLM7.io. Не отправляй пароли и личные данные.</div></div>
</main>
</div>
<script>
const API='https://api.llm7.io/v1/chat/completions';
const MODEL='gpt-oss:20b';
const $=id=>document.getElementById(id);
let chats=[],active=null,busy=false;
function makeChat(){return {id:crypto.randomUUID(),title:'Новый чат',messages:[]}}
function save(){try{localStorage.setItem('bluechat-chats',JSON.stringify(chats))}catch{}}
function load(){try{chats=JSON.parse(localStorage.getItem('bluechat-chats')||'[]')}catch{chats=[]}if(!chats.length)chats=[makeChat()];active=chats[0].id;renderHistory();renderChat()}
function current(){return chats.find(c=>c.id===active)}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderHistory(){$('history').innerHTML=chats.map(c=>'<button class="chatitem '+(c.id===active?'active':'')+'" data-id="'+c.id+'">◌ '+escapeHTML(c.title)+'</button>').join('');$('history').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{active=b.dataset.id;renderHistory();renderChat()})}
function renderChat(){const c=current();$('thread').innerHTML='';if(!c.messages.length){$('thread').innerHTML='<section class="welcome"><div class="spark">✦</div><h1>Чем займёмся?</h1><p>Спроси что угодно — GPT-OSS поможет разобраться, придумать или написать.</p><div class="suggestions"><button class="suggestion">Объясни простыми словами, как работает нейросеть</button><button class="suggestion">Придумай идею для небольшого сайта</button><button class="suggestion">Помоги написать красивый HTML и CSS</button><button class="suggestion">Составь план изучения JavaScript</button></div></section>';document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>send(b.textContent));}else{c.messages.forEach(m=>addMessage(m.role,m.content));}scrollBottom()}
function addMessage(role,text){const el=document.createElement('div');el.className='message '+(role==='user'?'user':'assistant');el.innerHTML='<div class="avatar">'+(role==='user'?'Я':'✦')+'</div><div class="content"></div>';el.querySelector('.content').textContent=text;$('thread').appendChild(el);return el}
function scrollBottom(){$('messages').scrollTop=$('messages').scrollHeight}
function setBusy(v){busy=v;$('send').disabled=v;$('prompt').disabled=v;$('status').textContent=v?'Генерирую ответ…':'Бесплатная модель · онлайн API'}
async function send(text){text=(text||$('prompt').value).trim();if(!text||busy)return;const c=current();if(!c.messages.length){c.title=text.length>30?text.slice(0,30)+'…':text;renderHistory()}c.messages.push({role:'user',content:text});addMessage('user',text);$('prompt').value='';$('prompt').style.height='auto';setBusy(true);const placeholder=addMessage('assistant','Думаю…');scrollBottom();try{const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,messages:c.messages,stream:false})});if(!response.ok){let msg='HTTP '+response.status;try{const e=await response.json();msg=e.error?.message||e.message||msg}catch{}throw new Error(msg)}const data=await response.json();const answer=data.choices?.[0]?.message?.content;if(!answer)throw new Error('API не вернул текст ответа');placeholder.querySelector('.content').textContent=answer;c.messages.push({role:'assistant',content:answer});save()}catch(e){placeholder.querySelector('.content').textContent='Не удалось получить ответ: '+e.message+'\n\nПроверь доступность LLM7.io и попробуй ещё раз.';c.messages.pop()}finally{setBusy(false);scrollBottom()}}
$('form').addEventListener('submit',e=>{e.preventDefault();send()});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('prompt').addEventListener('input',()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px'});$('newChat').onclick=()=>{const c=makeChat();chats.unshift(c);active=c.id;save();renderHistory();renderChat()};$('clear').onclick=()=>{const c=current();c.messages=[];c.title='Новый чат';save();renderHistory();renderChat()};load();
</script>
</body>
</html>
